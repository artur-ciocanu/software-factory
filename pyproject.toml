[project]
name = "software-factory"
version = "0.1.0"
description = "Fail-closed Hermes Kanban factory plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

# Native directory plugin: import the colocated source, not a pip-installed wheel.
# Buildable copies with the same project name collide across Hermes profiles.
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "ty>=0.0.1a0"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ARG", "SIM", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["software_factory"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The root __init__.py is loaded as a package by Hermes, not as pytest's
# standalone "__init__" module (the repository directory contains a hyphen).
addopts = "-q --confcutdir=tests"
