[project]
name = "software-factory"
version = "0.1.0"
description = "Fail-closed Hermes Kanban factory plugin"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.entry-points."hermes_agent.plugins"]
software-factory = "software_factory"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/software_factory"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "ty>=0.0.1a0"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ARG", "SIM", "PLC0415"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["software_factory"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
